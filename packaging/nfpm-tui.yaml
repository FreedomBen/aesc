# nfpm config — aesc-tui package (.deb / .rpm).
#
# Built via `make package` (or package-deb / package-rpm), which exports the
# VERSION and ARCH variables referenced below. To run nfpm by hand, set them
# yourself, e.g.:
#   VERSION=0.1.0 ARCH=amd64 nfpm package -f packaging/nfpm-tui.yaml -p deb -t dist
#
# nfpm reference: https://nfpm.goreleaser.com
name: aesc-tui
# Successor metadata for the rename from "paladin-tui" lives under `overrides`
# below — it must stay version-scoped, see the comment there.
arch: ${ARCH}
platform: linux
version: ${VERSION}
release: "1"
section: utils
priority: optional
maintainer: "Benjamin Porter <FreedomBen@users.noreply.github.com>"
vendor: "Benjamin Porter"
homepage: "https://github.com/FreedomBen/paladin"
license: "MIT OR Apache-2.0"
description: |
  Simple, safe symmetric file encryption (interactive terminal UI).

  An interactive, full-screen terminal front-end over the same aesc core
  as the CLI: AES-256-GCM (or ChaCha20-Poly1305) with an Argon2id-derived key
  and a self-describing, authenticated file format. This package installs the
  `aesc-tui` command and its man page.

contents:
  - src: ./target/release/aesc-tui
    dst: /usr/bin/aesc-tui
    file_info:
      mode: 0755
  - src: ./docs/aesc-tui.1
    dst: /usr/share/man/man1/aesc-tui.1
    file_info:
      mode: 0644

# nfpm does not derive shared-library dependencies; declare them per packager.
#
# The package was renamed from "paladin-tui" (last release under that name:
# 0.2.1). The replaces/conflicts below (deb: Replaces/Conflicts,
# rpm: Obsoletes/Conflicts) let installing aesc-tui remove an old
# paladin-tui package, but are scoped to < 0.3.0 (the first aesc version) so
# they never block an unrelated package of that name from installing — which
# is also why there is no Provides on the old name. The version-constraint
# syntax differs per packager, hence the per-format entries.
overrides:
  deb:
    depends:
      - libc6
    replaces:
      - paladin-tui (<< 0.3.0)
    conflicts:
      - paladin-tui (<< 0.3.0)
  rpm:
    depends:
      - glibc
    replaces:
      - paladin-tui < 0.3.0
    conflicts:
      - paladin-tui < 0.3.0
