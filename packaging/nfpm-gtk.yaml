# nfpm config — aesc-gtk desktop package (.deb / .rpm).
#
# Built via `make package` (or package-deb / package-rpm), which exports the
# VERSION and ARCH variables referenced below. To run nfpm by hand, set them
# yourself, e.g.:
#   VERSION=0.1.0 ARCH=amd64 nfpm package -f packaging/nfpm-gtk.yaml -p deb -t dist
#
# nfpm reference: https://nfpm.goreleaser.com
name: aesc-gtk
# Successor metadata for the rename from "paladin-gtk" lives under `overrides`
# below — it must stay version-scoped, see the comment there.
arch: ${ARCH}
platform: linux
version: ${VERSION}
release: "1"
section: utils
priority: optional
maintainer: "Benjamin Porter <FreedomBen@users.noreply.github.com>"
vendor: "Benjamin Porter"
homepage: "https://github.com/FreedomBen/paladin"
license: "MIT OR Apache-2.0"
description: |
  Simple, safe symmetric file encryption (GTK4/libadwaita desktop app).

  A native desktop front-end over the same aesc core as the CLI:
  AES-256-GCM (or ChaCha20-Poly1305) with an Argon2id-derived key and a
  self-describing, authenticated file format. This package installs the
  `aesc-gtk` application, its desktop entry, icon, and AppStream metainfo.

contents:
  - src: ./target/release/aesc-gtk
    dst: /usr/bin/aesc-gtk
    file_info:
      mode: 0755
  - src: ./data/org.aesc.Gtk.desktop
    dst: /usr/share/applications/org.aesc.Gtk.desktop
    file_info:
      mode: 0644
  - src: ./data/icons/hicolor/scalable/apps/org.aesc.Gtk.svg
    dst: /usr/share/icons/hicolor/scalable/apps/org.aesc.Gtk.svg
    file_info:
      mode: 0644
  - src: ./data/icons/hicolor/symbolic/apps/org.aesc.Gtk-symbolic.svg
    dst: /usr/share/icons/hicolor/symbolic/apps/org.aesc.Gtk-symbolic.svg
    file_info:
      mode: 0644
  - src: ./data/icons/hicolor/16x16/apps/org.aesc.Gtk.png
    dst: /usr/share/icons/hicolor/16x16/apps/org.aesc.Gtk.png
    file_info:
      mode: 0644
  - src: ./data/icons/hicolor/24x24/apps/org.aesc.Gtk.png
    dst: /usr/share/icons/hicolor/24x24/apps/org.aesc.Gtk.png
    file_info:
      mode: 0644
  - src: ./data/icons/hicolor/32x32/apps/org.aesc.Gtk.png
    dst: /usr/share/icons/hicolor/32x32/apps/org.aesc.Gtk.png
    file_info:
      mode: 0644
  - src: ./data/icons/hicolor/48x48/apps/org.aesc.Gtk.png
    dst: /usr/share/icons/hicolor/48x48/apps/org.aesc.Gtk.png
    file_info:
      mode: 0644
  - src: ./data/icons/hicolor/64x64/apps/org.aesc.Gtk.png
    dst: /usr/share/icons/hicolor/64x64/apps/org.aesc.Gtk.png
    file_info:
      mode: 0644
  - src: ./data/icons/hicolor/128x128/apps/org.aesc.Gtk.png
    dst: /usr/share/icons/hicolor/128x128/apps/org.aesc.Gtk.png
    file_info:
      mode: 0644
  - src: ./data/icons/hicolor/256x256/apps/org.aesc.Gtk.png
    dst: /usr/share/icons/hicolor/256x256/apps/org.aesc.Gtk.png
    file_info:
      mode: 0644
  - src: ./data/icons/hicolor/512x512/apps/org.aesc.Gtk.png
    dst: /usr/share/icons/hicolor/512x512/apps/org.aesc.Gtk.png
    file_info:
      mode: 0644
  - src: ./data/org.aesc.Gtk.metainfo.xml
    dst: /usr/share/metainfo/org.aesc.Gtk.metainfo.xml
    file_info:
      mode: 0644

# nfpm does not derive shared-library dependencies; declare the GTK runtime
# per packager (Debian/Ubuntu vs Fedora/RHEL use different package names).
#
# The package was renamed from "paladin-gtk" (last release under that name:
# 0.2.1). The replaces/conflicts below (deb: Replaces/Conflicts,
# rpm: Obsoletes/Conflicts) let installing aesc-gtk remove an old
# paladin-gtk package, but are scoped to < 0.3.0 (the first aesc version) so
# they never block an unrelated package of that name from installing — which
# is also why there is no Provides on the old name. The version-constraint
# syntax differs per packager, hence the per-format entries.
overrides:
  deb:
    depends:
      - libc6
      - libgtk-4-1
      - libadwaita-1-0
    replaces:
      - paladin-gtk (<< 0.3.0)
    conflicts:
      - paladin-gtk (<< 0.3.0)
  rpm:
    depends:
      - glibc
      - gtk4
      - libadwaita
    replaces:
      - paladin-gtk < 0.3.0
    conflicts:
      - paladin-gtk < 0.3.0
