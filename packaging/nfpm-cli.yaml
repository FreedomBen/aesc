# nfpm config — aesc CLI package (.deb / .rpm).
#
# Built via `make package` (or package-deb / package-rpm), which exports the
# VERSION and ARCH variables referenced below. To run nfpm by hand, set them
# yourself, e.g.:
#   VERSION=0.1.0 ARCH=amd64 nfpm package -f packaging/nfpm-cli.yaml -p deb -t dist
#
# nfpm reference: https://nfpm.goreleaser.com
name: aesc
# The package was renamed from "paladin"; declaring the old name lets package
# managers treat this as its successor (deb: Replaces/Conflicts/Provides,
# rpm: Obsoletes/Conflicts/Provides).
provides:
  - paladin
replaces:
  - paladin
conflicts:
  - paladin
arch: ${ARCH}
platform: linux
version: ${VERSION}
release: "1"
section: utils
priority: optional
maintainer: "Benjamin Porter <FreedomBen@users.noreply.github.com>"
vendor: "Benjamin Porter"
homepage: "https://github.com/FreedomBen/paladin"
license: "MIT OR Apache-2.0"
description: |
  Simple, safe symmetric file encryption (command-line interface).

  aesc encrypts files with AES-256-GCM (or ChaCha20-Poly1305) and an
  Argon2id-derived key. Encrypted files begin with a self-describing,
  authenticated header, so they decrypt with only the password or keyfile —
  no out-of-band parameters. This package installs the `aesc` command
  and its man page.

contents:
  - src: ./target/release/aesc
    dst: /usr/bin/aesc
    file_info:
      mode: 0755
  - src: ./crates/aesc-cli/aesc.1
    dst: /usr/share/man/man1/aesc.1
    file_info:
      mode: 0644

# nfpm does not derive shared-library dependencies; declare them per packager.
# A statically-linked Rust binary still links libc dynamically.
overrides:
  deb:
    depends:
      - libc6
  rpm:
    depends:
      - glibc
