[package]
name = "aesc-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line front-end for aesc (binary: aesc)"

[lints]
workspace = true

[[bin]]
name = "aesc"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
ctrlc = "3.5.2"
indicatif = "0.18.4"
rpassword = "7.5.4"
aesc-common = { version = "0.2.1", path = "../aesc-common" }
aesc-core = { version = "0.2.1", path = "../aesc-core" }
zeroize = "1.8.2"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
